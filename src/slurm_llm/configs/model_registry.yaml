# Models slurm-llm can serve: ~/.config/slurm-llm/model_registry.yaml
#
#   id:              Hugging Face cache name: "models--" + repo id with "/" replaced by "--"
#   short_name:      the name you use in commands and API requests
#   size:            a profile in resources.yaml (memory, time limit)
#   tags:            free-form; `reasoning` makes `sllm query` show <think> text dimmed
#   max_model_len:   optional context window for vLLM (smaller needs less GPU memory)
#   model_memory_gb: optional total GPU memory to request, overriding the estimate from `sllm scan`
#   vllm_extra_args: optional list of extra `vllm serve` arguments

models:
  # Huge
  - id: models--deepseek-ai--DeepSeek-R1-Distill-Llama-70B
    short_name: deepseek-70b
    provider: vllm
    size: huge
    tags: [reasoning]
  # Large
